name: Add Daily Framework Blocks

on:
  push:
    branches:
      - daily-framework-blocks
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-framework-blocks:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: daily-framework-blocks

      - name: Insert standard framework block into daily pages
        run: |
          python3 <<'PY'
          from pathlib import Path

          block = '''
<section class="callout">
  <h2>Standard Class Framework</h2>
  <p>This class follows the MCA three-hour class framework: Student Check-In, Safety Brief, Lesson Review, New Instruction, Instructor Demonstration, Hands-On Lab, Practical Checkoff, Laboratory Shutdown, and After Action Review.</p>
  <p>Lesson A and Lesson B deliver new instruction and hands-on practice. Milestone sessions are reserved for quizzes, practical checkoffs, makeups, CETa practice questions, troubleshooting, documentation review, coaching, tool inventory, equipment maintenance, and AAR. No new instruction occurs on Milestone Days.</p>
  <p><a href="../../program/standard-three-hour-class-framework.html">View the standard three-hour class framework</a> and <a href="../../program/milestone-session-guide.html">milestone-session guide</a>.</p>
</section>
'''

          changed = []
          for path in sorted(Path('weeks').glob('week*/day*.html')):
              text = path.read_text(encoding='utf-8')
              if 'Standard Class Framework' in text:
                  continue
              if '<main>\n' in text:
                  text = text.replace('<main>\n', '<main>\n' + block, 1)
              elif '<main>' in text:
                  text = text.replace('<main>', '<main>' + block, 1)
              else:
                  raise SystemExit(f'Missing <main> in {path}')
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          print('Updated daily pages:')
          for item in changed:
              print(f'- {item}')
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No daily pages needed updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weeks
          git commit -m "Add standard framework block to daily lesson pages"
          git push origin daily-framework-blocks
